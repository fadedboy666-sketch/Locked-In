name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Bundle native notifications
        run: npx --yes esbuild@0.24.2 www/notifications.js --bundle --format=iife --outfile=www/notifications.bundle.js
        
      - name: Bundle native backup plugins
        run: npx --yes esbuild@0.24.2 www/backup.js --bundle --format=iife --outfile=www/backup.bundle.js


      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure exact alarms and Locked In notification icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if "android.permission.SCHEDULE_EXACT_ALARM" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
              manifest.write_text(content)

          source = Image.open("www/icon-512.png").convert("RGB")
          luminance = ImageOps.grayscale(source)
          alpha = luminance.point(lambda value: max(0, min(255, int((value - 55) * 255 / 170))))
          icon = Image.new("RGBA", source.size, (255, 255, 255, 0))
          icon.putalpha(alpha)
          icon = icon.resize((96, 96), Image.Resampling.LANCZOS)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          
          icon.save(drawable / "ic_stat_locked_in.png")

          # Keep the exact original charcoal-background logo for the notification card.
          drawable_nodpi = Path("android/app/src/main/res/drawable-nodpi")
          drawable_nodpi.mkdir(parents=True, exist_ok=True)
          Image.open("www/icon-512.png").convert("RGBA").save(
              drawable_nodpi / "ic_large_locked_in.png"
          )

          print("Exact-alarm permission, monochrome status icon, and full-colour notification icon configured.")
          PY

      - name: Configure Locked In native splash screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          styles = Path("android/app/src/main/res/values/styles.xml")
          content = styles.read_text()

          pattern = r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
          match = re.search(pattern, content, re.S)

          if not match:
              raise SystemExit("Launch theme not found. Build stopped.")

          block = match.group(2)

          items = {
              "android:background": "@drawable/lockedin_splash",
              "windowSplashScreenBackground": "#222326",
              "windowSplashScreenAnimatedIcon": "@mipmap/ic_launcher",
              "postSplashScreenTheme": "@style/AppTheme.NoActionBar"
          }

          for name, value in items.items():
              item = f'<item name="{name}">{value}</item>'
              pattern_item = rf'<item name="{re.escape(name)}">.*?</item>'

              if re.search(pattern_item, block):
                  block = re.sub(pattern_item, lambda _: item, block)
              else:
                  block += "\n        " + item

          content = (
              content[:match.start()]
              + match.group(1) + block + match.group(3)
              + content[match.end():]
          )
          styles.write_text(content)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          colors = values / "colors.xml"

          if colors.exists():
              color_content = colors.read_text()
          else:
              color_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          color_item = '<color name="lockedin_splash_background">#222326</color>'
          color_pattern = r'<color name="lockedin_splash_background">.*?</color>'

          if re.search(color_pattern, color_content):
              color_content = re.sub(color_pattern, color_item, color_content)
          else:
              color_content = color_content.replace(
                  "</resources>",
                  "    " + color_item + "\n</resources>"
              )

          colors.write_text(color_content)

          splash = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/lockedin_splash_background" />
              <item
                  android:drawable="@mipmap/ic_launcher"
                  android:gravity="center" />
          </layer-list>
          '''

          (drawable / "lockedin_splash.xml").write_text(splash)

          print("Locked In splash screen configured.")
          PY

      - name: Generate Android launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("www/icon-512.png").convert("RGBA")
          root = Path("android/app/src/main/res")

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in densities.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          foreground_sizes = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432
          }
          for density, size in foreground_sizes.items():
              folder = root / f"mipmap-{density}"

              foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              artwork_size = int(size * 0.76)
              artwork = source.resize((artwork_size, artwork_size), Image.Resampling.LANCZOS)
              offset = ((size - artwork_size) // 2, (size - artwork_size) // 2)
              foreground.alpha_composite(artwork, offset)
              foreground.save(folder / "ic_launcher_foreground.png")

          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          print("Android launcher icons generated successfully.")
          PY

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockedIn-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
