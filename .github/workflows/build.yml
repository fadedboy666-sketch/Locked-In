name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Bundle native notifications
        run: npx --yes esbuild@0.24.2 www/notifications.js --bundle --format=iife --outfile=www/notifications.bundle.js
        
      - name: Bundle native backup plugins
        run: npx --yes esbuild@0.24.2 www/backup.js --bundle --format=iife --outfile=www/backup.bundle.js
      - name: Bundle Firebase
        run: npx --yes esbuild@0.24.2 www/firebase.js --bundle --format=iife --outfile=www/firebase.bundle.js


      - name: Bundle App Blocker UI
        run: |
          npx --yes esbuild@0.24.2 www/app-blocker.js --bundle --format=iife --outfile=www/app-blocker.bundle.js
          python3 - <<'PY'
          from pathlib import Path
          index = Path('www/index.html')
          content = index.read_text()
          tag = '<script src="app-blocker.bundle.js"></script>'
          if tag not in content:
              anchor = '<script src="backup.bundle.js"></script>'
              if anchor in content:
                  content = content.replace(anchor, tag + anchor, 1)
              else:
                  content = content.replace('</body>', tag + '</body>', 1)
              index.write_text(content)
          print('App Blocker UI bundle linked.')
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Install native Internet Filter VPN plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_root = Path("android/app/src/main/java")
          main_activity = next(java_root.rglob("MainActivity.java"), None)
          if main_activity is None:
              raise SystemExit("Capacitor MainActivity.java was not generated.")
          main_text = main_activity.read_text()
          package_match = re.search(r"^package\s+([\w.]+);", main_text, re.M)
          if not package_match:
              raise SystemExit("Could not identify the Android package name.")
          package_name = package_match.group(1)
          package_dir = java_root.joinpath(*package_name.split("."))
          package_dir.mkdir(parents=True, exist_ok=True)

          for filename in ("InternetFilterPlugin.java", "InternetFilterVpnService.java"):
              source = Path("native") / filename
              target = package_dir / filename
              target.write_text(source.read_text().replace("PACKAGE_NAME", package_name))

          if "InternetFilterPlugin" not in main_text:
              main_text = main_text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\nimport " + package_name + ".InternetFilterPlugin;\nimport android.os.Bundle;"
              )
              main_text = main_text.replace(
                  "public class MainActivity extends BridgeActivity {}",
                  "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(InternetFilterPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}"
              )
              if "registerPlugin(InternetFilterPlugin.class)" not in main_text:
                  raise SystemExit("Could not safely register the Internet Filter plugin.")
              main_activity.write_text(main_text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          permission_names = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
              "android.permission.POST_NOTIFICATIONS"
          ]
          for name in permission_names:
              if name not in xml:
                  xml = xml.replace("<application", '<uses-permission android:name="' + name + '" />\n    <application', 1)

          service_name = package_name + ".InternetFilterVpnService"
          if service_name not in xml:
              service = (
                  '    <service android:name="' + service_name + '"\n'
                  '        android:permission="android.permission.BIND_VPN_SERVICE"\n'
                  '        android:exported="true"\n'
                  '        android:foregroundServiceType="specialUse">\n'
                  '        <intent-filter><action android:name="android.net.VpnService" /></intent-filter>\n'
                  '        <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="DNS filtering for adult website protection" />\n'
                  '    </service>\n'
              )
              xml = xml.replace("</application>", service + "</application>", 1)
          manifest.write_text(xml)
          print("Internet Filter VPN service and Capacitor plugin installed.")
          PY
      - name: Install native App Blocker
        run: python3 native/install_app_blocker.py

      - name: Increase Gradle download timeout
        run: |
          sed -i 's/networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties

      
      - name: Configure Firebase Android
        run: |
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Enable Google sign-in dependencies
          variables = Path("android/variables.gradle")
          content = variables.read_text()

          if "rgcfaIncludeGoogle" not in content:
              content = content.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1
              )
          variables.write_text(content)

          # Add Google's Gradle plugin to the main build file
          root = Path("android/build.gradle")
          content = root.read_text()

          if "com.google.gms:google-services" not in content:
              content = re.sub(
                  r"dependencies\s*\{",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  content,
                  count=1
              )
          root.write_text(content)

          # Activate the plugin for the app
          app = Path("android/app/build.gradle")
          content = app.read_text()

          if "com.google.gms.google-services" not in content:
              content += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(content)

          print("Firebase Android Gradle configuration completed.")
          PY


      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Restore permanent signing key
        env:
          KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.KEYSTORE_ENCRYPTED_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_ENCRYPTED_BASE64" | base64 --decode > encrypted-key.gpg

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$KEYSTORE_PASSWORD" \
            --decrypt encrypted-key.gpg > android/app/lockedin-release.jks

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("lockedin-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          """

          if "signingConfigs {" not in content:
              content = content.replace("    buildTypes {", signing + "    buildTypes {", 1)

          if "debug {" not in content:
              content = content.replace(
                  "    buildTypes {",
                  "    buildTypes {\n        debug { signingConfig signingConfigs.release }",
              )

          path.write_text(content)
          print("Permanent signing configuration added.")
          PY


      - name: Configure exact alarms and Locked In notification icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if "android.permission.SCHEDULE_EXACT_ALARM" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
              manifest.write_text(content)

          source = Image.open("www/icon-512.png").convert("RGB")
          luminance = ImageOps.grayscale(source)
          alpha = luminance.point(lambda value: max(0, min(255, int((value - 55) * 255 / 170))))
          icon = Image.new("RGBA", source.size, (255, 255, 255, 0))
          icon.putalpha(alpha)
          icon = icon.resize((96, 96), Image.Resampling.LANCZOS)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          
          icon.save(drawable / "ic_stat_locked_in.png")

          # Keep the exact original charcoal-background logo for the notification card.
          drawable_nodpi = Path("android/app/src/main/res/drawable-nodpi")
          drawable_nodpi.mkdir(parents=True, exist_ok=True)
          Image.open("www/icon-512.png").convert("RGBA").save(
              drawable_nodpi / "ic_large_locked_in.png"
          )

          print("Exact-alarm permission, monochrome status icon, and full-colour notification icon configured.")
          PY

      - name: Configure Locked In native splash screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          styles = Path("android/app/src/main/res/values/styles.xml")
          content = styles.read_text()

          pattern = r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
          match = re.search(pattern, content, re.S)

          if not match:
              raise SystemExit("Launch theme not found. Build stopped.")

          block = match.group(2)

          items = {
              "android:background": "@drawable/lockedin_splash",
              "windowSplashScreenBackground": "#222326",
              "windowSplashScreenAnimatedIcon": "@mipmap/ic_launcher",
              "postSplashScreenTheme": "@style/AppTheme.NoActionBar"
          }

          for name, value in items.items():
              item = f'<item name="{name}">{value}</item>'
              pattern_item = rf'<item name="{re.escape(name)}">.*?</item>'

              if re.search(pattern_item, block):
                  block = re.sub(pattern_item, lambda _: item, block)
              else:
                  block += "\n        " + item

          content = (
              content[:match.start()]
              + match.group(1) + block + match.group(3)
              + content[match.end():]
          )
          styles.write_text(content)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          colors = values / "colors.xml"

          if colors.exists():
              color_content = colors.read_text()
          else:
              color_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          color_item = '<color name="lockedin_splash_background">#222326</color>'
          color_pattern = r'<color name="lockedin_splash_background">.*?</color>'

          if re.search(color_pattern, color_content):
              color_content = re.sub(color_pattern, color_item, color_content)
          else:
              color_content = color_content.replace(
                  "</resources>",
                  "    " + color_item + "\n</resources>"
              )

          colors.write_text(color_content)

          splash = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/lockedin_splash_background" />
              <item
                  android:drawable="@mipmap/ic_launcher"
                  android:gravity="center" />
          </layer-list>
          '''

          (drawable / "lockedin_splash.xml").write_text(splash)

          print("Locked In splash screen configured.")
          PY

      - name: Generate Android launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("www/icon-512.png").convert("RGBA")
          root = Path("android/app/src/main/res")

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in densities.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          foreground_sizes = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432
          }
          for density, size in foreground_sizes.items():
              folder = root / f"mipmap-{density}"

              foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              artwork_size = int(size * 0.76)
              artwork = source.resize((artwork_size, artwork_size), Image.Resampling.LANCZOS)
              offset = ((size - artwork_size) // 2, (size - artwork_size) // 2)
              foreground.alpha_composite(artwork, offset)
              foreground.save(folder / "ic_launcher_foreground.png")

          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          print("Android launcher icons generated successfully.")
          PY

      
      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug


      - name: Verify APK before upload
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee "$APK.sha256"
          echo "APK exists and its internal ZIP structure is valid."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockedIn-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
