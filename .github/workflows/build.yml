
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android
      - name: Match native splash screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/styles.xml")
          content = path.read_text()

          pattern = r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'

          match = re.search(pattern, content, re.S)
          if not match:
              raise SystemExit("Launch theme not found. Build stopped safely.")

          block = match.group(2)

          items = {
              "windowSplashScreenBackground": "#222326",
              "windowSplashScreenAnimatedIcon": "@mipmap/ic_launcher",
              "postSplashScreenTheme": "@style/AppTheme.NoActionBar",
              "android:windowBackground": "#222326"
          }

          for name, value in items.items():
              tag = name
              item = f'<item name="{tag}">{value}</item>'
              pattern_item = rf'<item name="{re.escape(tag)}">.*?</item>'

              if re.search(pattern_item, block):
                  block = re.sub(pattern_item, item, block)
              else:
                  block += "\n        " + item

          updated = match.group(1) + block + match.group(3)
          content = content[:match.start()] + updated + content[match.end():]
          path.write_text(content)

          print("Native splash theme updated.")
          PY

      - name: Generate Android launcher icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("www/icon-512.png").convert("RGBA")
          root = Path("android/app/src/main/res")

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in densities.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          foreground_sizes = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432
          }

          for density, size in foreground_sizes.items():
    folder = root / f"mipmap-{density}"

    foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
    artwork_size = int(size * 0.66)

    artwork = source.resize(
        (artwork_size, artwork_size),
        Image.Resampling.LANCZOS
    )

    offset = (
        (size - artwork_size) // 2,
        (size - artwork_size) // 2
    )

    foreground.alpha_composite(artwork, offset)
    foreground.save(folder / "ic_launcher_foreground.png")
          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''

          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)


          print("Android launcher icons generated successfully.")
          PY

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockedIn-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
