
name: Generate Locked In Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Generate permanent signing key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          keytool -genkeypair \
            -keystore lockedin-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Locked In, OU=App, O=Locked In, L=Butwal, ST=Lumbini, C=NP"

          FINGERPRINT=$(keytool -list -v \
            -keystore lockedin-release.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" | grep "SHA1:" | head -1 | sed 's/.*SHA1: //')

          KEY_BASE64=$(base64 -w 0 lockedin-release.jks)

          gh secret set ANDROID_KEYSTORE_BASE64 --body "$KEY_BASE64" --repo "$GITHUB_REPOSITORY"
          echo "SHA-1 fingerprint: $FINGERPRINT"
