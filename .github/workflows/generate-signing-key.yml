
name: Generate Locked In Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate permanent signing key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore lockedin-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Locked In, OU=App, O=Locked In, L=Butwal, ST=Lumbini, C=NP"

          keytool -list -v \
            -keystore lockedin-release.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > fingerprint.txt

          base64 -w 0 lockedin-release.jks > keystore-base64.txt

      - name: Save generated key temporarily
        uses: actions/upload-artifact@v4
        with:
          name: LockedIn-Signing-Key
          path: |
            fingerprint.txt
            keystore-base64.txt
          retention-days: 1
