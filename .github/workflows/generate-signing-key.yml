
name: Generate Locked In Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate and encrypt signing key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"

          keytool -genkeypair \
            -keystore lockedin-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Locked In, OU=App, O=Locked In, L=Butwal, ST=Lumbini, C=NP"

          echo "SHA-1 fingerprint:"
          keytool -list -v \
            -keystore lockedin-release.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" | grep -i "SHA1:"

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$STORE_PASS" \
            --symmetric --cipher-algo AES256 \
            --output lockedin-release.jks.gpg \
            lockedin-release.jks

          base64 -w 0 lockedin-release.jks.gpg > keystore-encrypted-base64.txt
          rm -f lockedin-release.jks

      - name: Upload encrypted key backup
        uses: actions/upload-artifact@v4
        with:
          name: LockedIn-Encrypted-Signing-Key
          path: keystore-encrypted-base64.txt
          retention-days: 1
